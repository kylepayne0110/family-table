# Lint settings for this project (overrides any personal ruff config).
line-length = 120
target-version = "py314"

[lint]
# Real bugs and common mistakes. FastAPI's Depends() in defaults (B008) is the framework's normal style.
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = ["B008", "B904", "E731", "E741", "E702", "B905", "B007"]

[lint.per-file-ignores]
"tests/*" = ["B011", "B017"]
