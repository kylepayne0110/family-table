<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F4EDE1">
    <meta name="robots" content="noindex, nofollow">

    <title>{% block title %}Family Table{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
</head>

<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>

    {% block header %}{% endblock %}

    <main id="main" class="{% block main_class %}page{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <footer class="site-footer">
        <p>Family Table &middot; supper's at six</p>
    </footer>
    {% endblock %}
</body>
</html>
