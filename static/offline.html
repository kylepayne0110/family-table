<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F4EDE1">
    <meta name="robots" content="noindex, nofollow">
    <title>Family Table</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<!-- Shown by the service worker when the phone can't reach the server. No family data here. -->
<body class="offline-body">
    <main id="main" class="offline-card">
        <img class="offline-card__icon" src="/static/icons/icon-192.png" width="72" height="72" alt="">
        <h1 class="offline-card__title">Can't reach Family Table</h1>
        <p>Check that your phone is online (Wi-Fi or cellular), then try again.</p>
        <p class="offline-card__hint">Recipes, the meal plan, and the shopping list live on the family computer, so Family Table needs a connection to it.</p>
        <a class="btn btn-primary" href="">Try again</a>
    </main>
</body>
</html>
